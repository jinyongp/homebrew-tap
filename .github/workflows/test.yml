name: test

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          repository: ${{ github.repository }}
          ref: ${{ github.event.repository.default_branch }}
          path: source
      - name: Add formula spec fixture
        run: bash .github/workflows/scripts/add-formula-spec-fixture.sh
      - name: Shell syntax
        run: |
          bash -n actions/publish/formula/generate.sh
          bash -n scripts/setup-deploy-key.sh
          bash -n .github/workflows/scripts/add-formula-spec-fixture.sh
          bash -n .github/workflows/scripts/commit-formula.sh
          bash -n .github/workflows/scripts/delete-formula.sh
          bash -n .github/workflows/scripts/push-formula.sh
          bash -n .github/workflows/scripts/resolve-source-inputs.sh
      - name: Reject invalid source inputs
        run: |
          export GITHUB_OUTPUT="$RUNNER_TEMP/reject-source-repo"
          export GITHUB_REPOSITORY=owner/repo
          export INPUT_REPOSITORY=owner/repo/extra
          export INPUT_REF="$GITHUB_SHA"
          if output="$(bash .github/workflows/scripts/resolve-source-inputs.sh 2>&1)"; then
            echo "invalid source repository should fail"
            exit 1
          fi
          expected="repository must be owner/name, got: owner/repo/extra"
          if [[ "$output" != *"$expected"* ]]; then
            printf '%s\n' "$output" >&2
            echo "invalid source repository failed for an unexpected reason" >&2
            exit 1
          fi
      - name: Reject unknown deploy-key setup options
        run: |
          for option in --froce -force; do
            if output="$(bash scripts/setup-deploy-key.sh "$option" 2>&1)"; then
              echo "unknown deploy-key setup option should fail: $option"
              exit 1
            fi
            expected="Unknown option: $option"
            if [[ "$output" != *"$expected"* ]]; then
              printf '%s\n' "$output" >&2
              echo "unknown deploy-key setup option failed for an unexpected reason: $option" >&2
              exit 1
            fi
          done
      - name: Generate formula fixture
        uses: ./actions/publish/formula
        with:
          tap-path: .
          source-path: source
          formula: fixture
          repository: ${{ github.repository }}
          ref: ${{ github.event.repository.default_branch }}
      - name: Delete formula fixture
        run: |
          export GITHUB_OUTPUT="$RUNNER_TEMP/delete-formula"
          export FORMULA=fixture
          export DRY_RUN=true
          bash .github/workflows/scripts/delete-formula.sh
      - name: Reject invalid delete formula inputs
        run: |
          export GITHUB_OUTPUT="$RUNNER_TEMP/reject-delete-formula"
          export FORMULA=../fixture
          export DRY_RUN=true
          if bash .github/workflows/scripts/delete-formula.sh; then
            echo "invalid formula name should fail"
            exit 1
          fi
      - name: Validate generated formula syntax
        run: ruby -c Formula/fixture.rb
      - name: Validate generated formula stanzas
        run: |
          grep -q 'def caveats' Formula/fixture.rb
          grep -q 'service do' Formula/fixture.rb
          grep -q 'livecheck do' Formula/fixture.rb
          grep -q 'conflicts_with "hello"' Formula/fixture.rb
          grep -q 'uses_from_macos "zlib" => :build, since: :sequoia' Formula/fixture.rb
          grep -Fq 'system bin/"fixture", "--help"' Formula/fixture.rb
          grep -Fq 'shell_output("#{bin}/fixture --version")' Formula/fixture.rb
      - name: Audit generated formula
        run: |
          brew tap-new jinyongp/tap
          cp Formula/fixture.rb "$(brew --repo jinyongp/tap)/Formula/fixture.rb"
          brew audit --strict jinyongp/tap/fixture
      - name: Generate class-name fixture
        uses: ./actions/publish/formula
        with:
          tap-path: .
          source-path: source
          formula: libfoo++
          repository: ${{ github.repository }}
          ref: ${{ github.event.repository.default_branch }}
      - name: Validate generated class name
        run: |
          ruby -c Formula/libfoo++.rb
          grep -q 'class Libfooxx < Formula' Formula/libfoo++.rb
      - name: Generate versioned class-name fixture
        uses: ./actions/publish/formula
        with:
          tap-path: .
          source-path: source
          formula: openssl@1.1
          repository: ${{ github.repository }}
          ref: ${{ github.event.repository.default_branch }}
      - name: Validate versioned class name
        run: |
          ruby -c Formula/openssl@1.1.rb
          grep -q 'class OpensslAT11 < Formula' Formula/openssl@1.1.rb
      - name: Generate mixed-case class-name fixture
        uses: ./actions/publish/formula
        with:
          tap-path: .
          source-path: source
          formula: fooBar
          repository: ${{ github.repository }}
          ref: ${{ github.event.repository.default_branch }}
      - name: Validate mixed-case class name
        run: |
          ruby -c Formula/fooBar.rb
          grep -q 'class Foobar < Formula' Formula/fooBar.rb
      - name: Generate tag ref version fixture
        uses: ./actions/publish/formula
        with:
          tap-path: .
          source-path: source
          formula: fixture
          repository: ${{ github.repository }}
          ref: v1.2.3
      - name: Validate tag ref version normalization
        run: grep -q 'version "1.2.3"' Formula/fixture.rb
      - name: Generate explicit version fixture
        uses: ./actions/publish/formula
        with:
          tap-path: .
          source-path: source
          formula: fixture
          repository: ${{ github.repository }}
          ref: ${{ github.event.repository.default_branch }}
          version: v1.2.4
      - name: Validate explicit version normalization
        run: grep -q 'version "1.2.4"' Formula/fixture.rb
      - name: Reject invalid formula specs
        run: |
          set -euo pipefail

          expect_generation_failure() {
            local output_name="$1"
            local expected="$2"
            local formula="${3:-fixture}"
            local repository="${4:-$GITHUB_REPOSITORY}"
            local output

            if output="$(GITHUB_OUTPUT="$RUNNER_TEMP/$output_name" TAP_PATH=. SOURCE_PATH=source FORMULA="$formula" REPOSITORY="$repository" REF="$GITHUB_SHA" SPEC_PATH=".github/homebrew/formula.yml" bash actions/publish/formula/generate.sh 2>&1)"; then
              echo "$output_name should fail"
              exit 1
            fi
            if [[ "$output" != *"$expected"* ]]; then
              printf '%s\n' "$output" >&2
              echo "$output_name failed for an unexpected reason" >&2
              exit 1
            fi
          }

          cat > source/.github/homebrew/formula.yml <<'YAML'
          desc: Fixture formula
          license: MIT
          link_overwrite: false
          install: |
            prefix.install "README.md"
          test: |
            assert_path_exists prefix/"README.md"
          YAML
          expect_generation_failure reject-link-overwrite "link_overwrite must be a list"

          cat > source/.github/homebrew/formula.yml <<'YAML'
          desc: Fixture formula
          license: MIT
          conflicts_with:
            - formula: fixture-conflict
              becuase: typo
          install: |
            prefix.install "README.md"
          test: |
            assert_path_exists prefix/"README.md"
          YAML
          expect_generation_failure reject-conflict-key "unsupported conflicts_with[0] keys: becuase"

          cat > source/.github/homebrew/formula.yml <<'YAML'
          desc: Fixture formula
          license: MIT
          deprecate:
            date: "2026-06-03"
            because: unmaintained
            replacement: fixture-new
            replacement_formula: fixture-new
          install: |
            prefix.install "README.md"
          test: |
            assert_path_exists prefix/"README.md"
          YAML
          expect_generation_failure reject-replacement-keys "deprecate may contain only one replacement key"

          cat > source/.github/homebrew/formula.yml <<'YAML'
          desc: Fixture formula
          license: MIT
          disable:
            date: "2026-06-03"
            because: unsupported
            replacement: ""
          install: |
            prefix.install "README.md"
          test: |
            assert_path_exists prefix/"README.md"
          YAML
          expect_generation_failure reject-empty-replacement "replacement is required"

          expect_generation_failure reject-class-name "formula renders an invalid Ruby class name: 1foo" 1foo
          expect_generation_failure reject-at-class-name "formula renders an invalid Ruby class name: Foo@bar" foo@bar

          cat > source/.github/homebrew/formula.yml <<'YAML'
          desc: Fixture formula
          license: MIT
          dependencies:
            runtime:
              - go
            build:
              - go
          install: |
            prefix.install "README.md"
          test: |
            assert_path_exists prefix/"README.md"
          YAML
          expect_generation_failure reject-duplicate-dependency "dependencies may not contain duplicate names across groups: go"

          cat > source/.github/homebrew/formula.yml <<'YAML'
          desc: Fixture formula
          license: MIT
          disable:
            date: 2026-06-03
            because: unsupported
          install: |
            prefix.install "README.md"
          test: |
            assert_path_exists prefix/"README.md"
          YAML
          expect_generation_failure reject-unquoted-date "formula spec YAML is invalid"

          expect_generation_failure reject-repository "repository must be owner/name, got: owner/repo/extra" fixture owner/repo/extra
