name: auto-merge homebrew-tap updates

on:
  workflow_call:

concurrency:
  group: homebrew-tap-policy-${{ github.repository }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  policy-start:
    if: github.event_name == 'pull_request_target'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      statuses: write
    steps:
      - name: Mark policy pending
        env:
          GH_TOKEN: ${{ github.token }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          gh api --method POST "repos/$GITHUB_REPOSITORY/statuses/$PR_HEAD_SHA" \
            -f state=pending \
            -f context=homebrew-tap/policy \
            -f description="Reconciling homebrew-tap auto-merge policy" \
            -f target_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"

  authorize:
    if: >-
      github.event_name == 'pull_request_target' &&
      github.event.pull_request.user.login == 'dependabot[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      outcome: ${{ steps.authorization.outcome }}
    steps:
      - name: Check out policy automation
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: tap-automation
          persist-credentials: false
      - name: Fetch Dependabot metadata
        id: dependabot
        uses: dependabot/fetch-metadata@25dd0e34f4fe68f24cc83900b1fe3fe149efef98 # v3
        with:
          github-token: ${{ github.token }}
      - name: Collect pull request evidence
        continue-on-error: true
        id: authorization
        env:
          GH_TOKEN: ${{ github.token }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_CHANGED_FILE_COUNT: ${{ github.event.pull_request.changed_files }}
          PR_COMMIT_COUNT: ${{ github.event.pull_request.commits }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          UPDATED_DEPENDENCIES: ${{ steps.dependabot.outputs.updated-dependencies-json }}
        run: |
          if [ "$PR_COMMIT_COUNT" -gt 100 ] || [ "$PR_CHANGED_FILE_COUNT" -gt 100 ]; then
            echo "::error::Dependabot update is too large to verify."
            exit 1
          fi

          evidence="$RUNNER_TEMP/homebrew-tap-update"
          mkdir -p "$evidence/base-workflows" "$evidence/head-workflows"
          printf '%s' "$UPDATED_DEPENDENCIES" > "$evidence/metadata.json"
          gh api --method GET "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER/commits" \
            -f per_page=100 > "$evidence/commits.json"
          gh api --method GET "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER/files" \
            -f per_page=100 > "$evidence/files.json"

          approved_tag="$(
            gh api --method GET "repos/jinyongp/homebrew-tap/releases?per_page=100" \
              --paginate --slurp \
              --jq 'flatten | map(select(.draft == false and .immutable == true and .published_at != null and (.tag_name | startswith("automation-v"))))[0].tag_name // empty'
          )"
          if [ -z "$approved_tag" ]; then
            echo "::error::No immutable homebrew-tap automation release is available."
            exit 1
          fi
          approved_homebrew_tap_sha="$(
            gh api --method GET "repos/jinyongp/homebrew-tap/commits/$approved_tag" --jq .sha
          )"

          for side in base head; do
            if [ "$side" = "base" ]; then
              revision="$PR_BASE_SHA"
            else
              revision="$PR_HEAD_SHA"
            fi
            gh api --method GET "repos/$GITHUB_REPOSITORY/contents/.github/workflows" \
              -f ref="$revision" \
              --jq '.[] | select(.type == "file" and (.name | endswith(".yml") or endswith(".yaml"))) | .path' \
              > "$evidence/$side-workflow-paths"
            while IFS= read -r path; do
              gh api --method GET "repos/$GITHUB_REPOSITORY/contents/$path" \
                -f ref="$revision" --jq .content \
                | tr -d '\n' | base64 --decode > "$evidence/$side-workflows/${path##*/}"
            done < "$evidence/$side-workflow-paths"
          done

          python3 tap-automation/.github/workflows/scripts/authorize-homebrew-tap-update.py \
            --metadata "$evidence/metadata.json" \
            --commits "$evidence/commits.json" \
            --files "$evidence/files.json" \
            --expected-commit-count "$PR_COMMIT_COUNT" \
            --expected-file-count "$PR_CHANGED_FILE_COUNT" \
            --approved-homebrew-tap-sha "$approved_homebrew_tap_sha" \
            --base-workflows "$evidence/base-workflows" \
            --head-workflows "$evidence/head-workflows"

  reconcile:
    if: >-
      always() &&
      github.event_name == 'pull_request_target' &&
      github.event.pull_request.user.login == 'dependabot[bot]'
    needs:
      - policy-start
      - authorize
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
      pull-requests: write
    outputs:
      description: ${{ steps.reconcile.outputs.description }}
    steps:
      - name: Check out policy automation
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: tap-automation
          persist-credentials: false
      - name: Reconcile auto-merge policy
        id: reconcile
        env:
          AUTHORIZATION_OUTCOME: ${{ needs.policy-start.result == 'success' && needs.authorize.outputs.outcome || 'failure' }}
          GH_TOKEN: ${{ github.token }}
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_URL: ${{ github.event.pull_request.html_url }}
        run: bash tap-automation/.github/workflows/scripts/reconcile-homebrew-tap-policy.sh

  report:
    if: always() && github.event_name == 'pull_request_target'
    needs:
      - policy-start
      - authorize
      - reconcile
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      statuses: write
    steps:
      - name: Report policy result
        env:
          DESCRIPTION: ${{ needs.reconcile.outputs.description }}
          GH_TOKEN: ${{ github.token }}
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          POLICY_START_RESULT: ${{ needs.policy-start.result }}
          RECONCILE_RESULT: ${{ needs.reconcile.result }}
        run: |
          report_status() {
            gh api --method POST "repos/$GITHUB_REPOSITORY/statuses/$PR_HEAD_SHA" \
              -f state="$1" \
              -f context=homebrew-tap/policy \
              -f description="$2" \
              -f target_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          }

          if [ "$POLICY_START_RESULT" != "success" ]; then
            report_status failure "Failed to initialize homebrew-tap policy"
            exit 0
          fi
          if [ "$PR_AUTHOR" != "dependabot[bot]" ]; then
            report_status success "Manual pull request; auto-merge policy not applied"
            exit 0
          fi
          if [ "$RECONCILE_RESULT" != "success" ]; then
            report_status failure "Failed to reconcile homebrew-tap auto-merge policy"
            exit 0
          fi
          report_status success "$DESCRIPTION"
