name: publish formula

on:
  workflow_call:
    inputs:
      formula:
        required: true
        type: string
      repository:
        required: false
        type: string
        default: ""
      ref:
        required: false
        type: string
        default: ""
      version:
        required: false
        type: string
        default: ""
      spec-path:
        required: false
        type: string
        default: ".github/homebrew/formula.yml"
      dry-run:
        required: false
        type: boolean
        default: false
    secrets:
      token:
        required: false
      deploy_key:
        required: false

jobs:
  publish:
    runs-on: macos-latest
    timeout-minutes: 45
    concurrency:
      group: formula-${{ inputs.formula }}
      cancel-in-progress: false
    permissions:
      contents: read
    steps:
      - name: select credential
        id: credential
        run: |
          if [ "$DRY_RUN" = "true" ]; then
            echo "mode=dry_run" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ -n "$TOKEN" ] && [ -n "$DEPLOY_KEY" ]; then
            echo "::error::Provide either token or deploy_key, not both."
            exit 1
          fi
          if [ -n "$DEPLOY_KEY" ]; then
            echo "mode=deploy_key" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ -n "$TOKEN" ]; then
            echo "mode=token" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "::error::Provide token or deploy_key to publish the formula."
          exit 1
        env:
          DRY_RUN: ${{ inputs.dry-run }}
          TOKEN: ${{ secrets.token }}
          DEPLOY_KEY: ${{ secrets.deploy_key }}
      - name: checkout publishing tools
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: tap-tools
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: steps.credential.outputs.mode == 'token'
        with:
          repository: ${{ job.workflow_repository }}
          ref: main
          token: ${{ secrets.token }}
          path: tap
          fetch-depth: 0
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: steps.credential.outputs.mode == 'deploy_key'
        with:
          repository: ${{ job.workflow_repository }}
          ref: main
          ssh-key: ${{ secrets.deploy_key }}
          path: tap
          fetch-depth: 0
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: steps.credential.outputs.mode == 'dry_run'
        with:
          repository: ${{ job.workflow_repository }}
          ref: main
          path: tap
          fetch-depth: 0
          persist-credentials: false
      - name: resolve source inputs
        id: source
        run: bash tap-tools/.github/workflows/scripts/resolve-source-inputs.sh
        env:
          INPUT_REPOSITORY: ${{ inputs.repository }}
          INPUT_REF: ${{ inputs.ref }}
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ steps.source.outputs.repository }}
          ref: ${{ steps.source.outputs.ref }}
          path: source
          fetch-depth: 0
          persist-credentials: false
      - name: generate formula
        id: formula
        uses: ./tap-tools/actions/publish/formula
        with:
          tap-path: tap
          source-path: source
          formula: ${{ inputs.formula }}
          repository: ${{ steps.source.outputs.repository }}
          ref: ${{ steps.source.outputs.ref }}
          version: ${{ inputs.version }}
          spec-path: ${{ inputs.spec-path }}
      - name: validate formula
        env:
          TAP_PATH: tap
          FORMULA: ${{ inputs.formula }}
        run: bash tap-tools/.github/workflows/scripts/validate-formula.sh
      - name: commit formula
        if: ${{ !inputs.dry-run }}
        id: commit_formula
        working-directory: tap
        run: bash ../tap-tools/.github/workflows/scripts/commit-formula.sh
        env:
          FORMULA_PATH: ${{ steps.formula.outputs.formula-path }}
          FORMULA: ${{ inputs.formula }}
          VERSION: ${{ steps.formula.outputs.version }}
      - name: push formula
        if: ${{ !inputs.dry-run && steps.commit_formula.outputs.changed == 'true' }}
        working-directory: tap
        run: bash ../tap-tools/.github/workflows/scripts/push-formula.sh
